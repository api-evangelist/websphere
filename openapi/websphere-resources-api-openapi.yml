openapi: 3.2.0
info:
  title: WebSphere Application Server Admin REST Resources API
  description: REST API for administrative operations on IBM WebSphere Application Server including deployment, configuration, monitoring, and server management. Starting with version 9.0.0.1, Swagger documentation can be discovered and exposed for deployed RESTful endpoints.
  version: 9.0.5
  license:
    name: IBM International License Agreement
    url: https://www.ibm.com/legal/terms
  contact:
    name: IBM Support
    url: https://www.ibm.com/mysupport
servers:
- url: https://localhost:9443/ibm/api
  description: Default WebSphere Admin API Server
security:
- basicAuth: []
tags:
- name: Resources
  description: Resource management including data sources and JMS
paths:
  /resources/datasources:
    get:
      operationId: listDataSources
      summary: List Data Sources
      description: Returns a list of configured JDBC data sources.
      tags:
      - Resources
      responses:
        '200':
          description: List of data sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSource'
              examples:
                Listdatasources200Example:
                  summary: Default listDataSources 200 response
                  x-microcks-default: true
                  value:
                  - name: Example Title
                    jndiName: example_value
                    databaseType: example_value
                    jdbcProvider: example_value
                    connectionPool:
                      minConnections: 10
                      maxConnections: 10
                      connectionTimeout: 10
                      reapTime: 10
                    status: active
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /resources/datasources/{dsName}:
    get:
      operationId: getDataSource
      summary: Get Data Source Details
      description: Returns configuration details for a specific data source.
      tags:
      - Resources
      parameters:
      - name: dsName
        in: path
        required: true
        description: Data source name
        schema:
          type: string
        example: example_value
      responses:
        '200':
          description: Data source details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
              examples:
                Getdatasource200Example:
                  summary: Default getDataSource 200 response
                  x-microcks-default: true
                  value:
                    name: Example Title
                    jndiName: example_value
                    databaseType: example_value
                    jdbcProvider: example_value
                    connectionPool:
                      minConnections: 10
                      maxConnections: 10
                      connectionTimeout: 10
                      reapTime: 10
                    status: active
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /resources/datasources/{dsName}/test:
    post:
      operationId: testDataSourceConnection
      summary: Test Data Source Connection
      description: Tests the connection for a specific data source.
      tags:
      - Resources
      parameters:
      - name: dsName
        in: path
        required: true
        description: Data source name
        schema:
          type: string
        example: example_value
      responses:
        '200':
          description: Connection test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
              examples:
                Testdatasourceconnection200Example:
                  summary: Default testDataSourceConnection 200 response
                  x-microcks-default: true
                  value:
                    success: true
                    message: example_value
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          example: example_value
        message:
          type: string
          example: example_value
        details:
          type: string
          example: example_value
      required:
      - code
      - message
    DataSource:
      type: object
      properties:
        name:
          type: string
          description: Data source name
          example: Example Title
        jndiName:
          type: string
          description: JNDI name
          example: example_value
        databaseType:
          type: string
          description: Database type
          example: example_value
        jdbcProvider:
          type: string
          description: JDBC provider name
          example: example_value
        connectionPool:
          type: object
          properties:
            minConnections:
              type: integer
            maxConnections:
              type: integer
            connectionTimeout:
              type: integer
              description: Timeout in seconds
            reapTime:
              type: integer
              description: Reap time in seconds
          example: example_value
        status:
          type: string
          enum:
          - active
          - inactive
          example: active
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using WebSphere administrative credentials
    ltpaToken:
      type: apiKey
      in: cookie
      name: LtpaToken2
      description: LTPA token-based authentication
externalDocs:
  description: IBM WebSphere Application Server Documentation
  url: https://www.ibm.com/docs/en/was/9.0.5?topic=overview-administrative-rest-api
